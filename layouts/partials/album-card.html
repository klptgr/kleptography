{{ $gallery := partial "get-gallery.html" . }}

{{ if $gallery }}
    {{ $title := $gallery.page.Title | default $gallery.page.Name }}
    <a
        class="album-card"
        href="{{ $gallery.page.RelPermalink }}"
        title="{{ $title }}"
        aria-label="{{ $title }}">
        
        <figure
            class="album-card-image"
            style="background-color: {{ $gallery.color | default "#f5f5f5" }}">
            
            <img
                class="lazyload"
                width="{{ $gallery.thumbnail.Width }}"
                height="{{ $gallery.thumbnail.Height }}"
                data-src="{{ $gallery.thumbnail.RelPermalink }}"
                alt="{{ $title }}"
                loading="lazy"
                decoding="async" />
        </figure>
        
        <div class="album-card-overlay">
            <div class="album-card-copy">
                <h2 class="album-card-title">{{ $title }}</h2>
                {{ with $gallery.page.Description }}
                    <p class="album-card-description">{{ . }}</p>
                {{ end }}
            </div>
        </div>
    </a>
{{ else }}
    <div class="error-message" role="alert">
        {{ printf "Gallery not found for: %s" (.Title | default "Untitled") }}
    </div>
{{ end }}
